<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Annealing Visualizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            margin-top: 2rem;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { margin-top: 0; color: var(--accent-color); font-size: 1.5rem; }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 1rem;
            font-family: monospace;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
        }
        .label { color: #94a3b8; }
        .value { color: var(--accent-color); font-weight: bold; }
        
        canvas {
            width: 100%;
            height: auto;
            background: #000;
            border-radius: 4px;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 1.5rem;
            display: flex;
            gap: 10px;
        }
        button {
            background: var(--accent-color);
            border: none;
            color: var(--bg-color);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #64748b; cursor: not-allowed; }

        .explanation {
            margin-top: 2rem;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
            border-top: 1px solid #334155;
            padding-top: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>量子モンテカルロ・シミュレーション</h1>
    
    <div class="stats">
        <div><span class="label">温度 (kT):</span> <span class="value">0.02</span></div>
        <div><span class="label">横磁場 (G):</span> <span id="GG" class="value">10.000</span></div>
        <div><span id="status" class="value" style="color:#fbbf24">Running...</span></div>
    </div>

    <canvas id="main" width="1050" height="400"></canvas>

    <div class="controls">
        <button id="resetBtn">再試行</button>
    </div>

    <div class="explanation">
        <h3>これについて</h3>
        <p>
            このプログラムは、**量子アニーリング（量子焼きなまし法）**の過程を可視化しています。
            縦軸は「トロッター次元（虚時間）」と呼ばれる量子的な並行世界、横軸は「スピン（磁石の向き）」の並びを表します。
        </p>
        <p>
            最初は横磁場（G）が強く、システムはバラバラの状態ですが、Gを徐々に弱めることで量子的なゆらぎが収まり、
            最終的にすべての世界（縦列）が同じ色の模様（基底状態）に揃っていく様子を観察できます。
        </p>
    </div>
</div>

<script>
    const N = 150;     // 空間サイズ
    const m = 50;      // トロッター数（量子次元）
    const kT = 0.02;   // 熱ゆらぎ
    const jij = 1;     // 相互作用係数
    const loop = 50000; // 1フレームあたりの試行回数
    
    let G = 10;
    let q = [];
    let anneal;

    const canvas = document.getElementById('main');
    const ctx = canvas.getContext('2d');
    const gDisplay = document.getElementById('GG');
    const statusDisplay = document.getElementById('status');

    function init() {
        G = 10;
        for(let j=0; j<m; j++){
            q[j] = [];
            for(let i=0; i<N; i++){
                q[j][i] = Math.random() > 0.5 ? 1 : -1;
            }
        }
        statusDisplay.innerText = "Running...";
        statusDisplay.style.color = "#fbbf24";
        if(anneal) clearInterval(anneal);
        run();
    }

    function run() {
        anneal = setInterval(function(){
            // モンテカルロ・ステップ
            for(let k=0; k<loop; k++){
                let y = Math.floor(Math.random()*m);
                let x = Math.floor(Math.random()*N);
                
                // 隣接相互作用エネルギー差
                let dE = (jij*2*q[y][x]*q[y][(N+x-1)%N] + jij*2*q[y][x]*q[y][(x+1)%N])/m;
                
                // 量子ゆらぎ項の計算
                let kk = G/kT/m;
                let weight = Math.log(Math.tanh(kk)) / kT;
                dE -= q[y][x] * (q[(m+y-1)%m][x] + q[(y+1)%m][x]) * weight;

                // メトロポリス法による判定
                if(dE < 0 || Math.exp(-dE/kT) > Math.random()){
                    q[y][x] = -q[y][x];
                }
            }

            // 描画
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for(let j=0; j<m; j++){
                for(let i=0; i<N; i++){
                    ctx.fillStyle = q[j][i] === 1 ? '#ef4444' : '#1e293b';
                    ctx.fillRect(i*7, j*8, 6, 6);
                }
            }

            // アニーリング係数の更新
            G *= 0.995;
            gDisplay.innerHTML = G.toFixed(3);

            if(G < 0.05){
                clearInterval(anneal);
                statusDisplay.innerText = "Finished";
                statusDisplay.style.color = "#4ade80";
            }
        }, 30);
    }

    document.getElementById('resetBtn').addEventListener('click', init);
    init();
</script>

</body>
</html>
